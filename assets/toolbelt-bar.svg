<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" role="img" aria-labelledby="title desc"><title id="title">Animated technology bar</title><desc id="desc">A subtle moving charcoal line over a pale square grid.</desc><defs><pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#111827" stroke-opacity=".06"/></pattern><style>@keyframes slide{from{transform:translateX(-220px)}to{transform:translateX(1220px)}}.line{animation:slide 9s linear infinite}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style></defs><rect width="1200" height="104" rx="18" fill="#faf9f7"/><rect width="1200" height="104" rx="18" fill="url(#grid)"/><text x="28" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.6" fill="#4b5563">TOOLS I USE TO SHIP</text><text x="28" y="73" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111827">JAVASCRIPT  ·  TYPESCRIPT  ·  REACT  ·  NODE  ·  SQLITE  ·  THREE.JS  ·  GSAP  ·  WEBGL</text><g class="line"><rect x="0" y="88" width="220" height="3" rx="1.5" fill="#111827" opacity=".75"/></g></svg>
